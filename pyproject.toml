[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbc-lab"
version = "0.1.0"
description = "Humanoid whole-body control experiments built on IsaacLab and robot_lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["source/hbc_lab"]

[tool.setuptools.package-data]
hbc_lab = [
    "assets/models/articulated/**/*.usd",
    "assets/models/unitree_sim_isaaclab/assets/robots/g1-29dof_wholebody_dex1/.asset_hash",
    "assets/models/unitree_sim_isaaclab/assets/robots/g1-29dof_wholebody_dex1/*.yaml",
    "assets/models/unitree_sim_isaaclab/assets/robots/g1-29dof_wholebody_dex1/*.usd",
    "assets/models/unitree_sim_isaaclab/assets/robots/g1-29dof_wholebody_dex1/configuration/*.usd",
]
